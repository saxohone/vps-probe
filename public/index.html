<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 VPS 探针</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📡</text></svg>">
<style>
  :root {
    --bg: #0a0e14;
    --card: #10161f;
    --border: #1c2735;
    --border-hi: #2e4160;
    --text: #dce5f0;
    --muted: #7d8da3;
    --dim: #516078;
    --cyan: #36cfc9;
    --purple: #b37feb;
    --down: #4ade80;
    --up: #f472b6;
    --good: #4ade80;
    --mid: #facc15;
    --bad: #f87171;
    --fail: #64748b;
    --ct: #38bdf8;
    --cu: #fb923c;
    --cm: #a78bfa;
    --mono: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "MiSans", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1000px 520px at 5% -12%, rgba(54, 207, 201, .10), transparent 62%),
      radial-gradient(1100px 620px at 98% 112%, rgba(179, 127, 235, .10), transparent 62%),
      var(--bg);
    background-attachment: fixed;
    padding: 22px clamp(12px, 3vw, 36px) 40px;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ================= 头部 ================= */
  header { max-width: 1480px; margin: 0 auto 20px; }
  .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 {
    font-size: 24px; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(92deg, #7ee7e2, #36cfc9 40%, #b37feb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 3px 12px; border-radius: 99px;
    border: 1px solid var(--border); color: var(--muted); transition: color .3s, border-color .3s;
  }
  .conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .conn.live { color: var(--good); border-color: rgba(74, 222, 128, .35); }
  .conn.live::before { background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
  .conn.err { color: var(--bad); border-color: rgba(248, 113, 113, .4); }
  .conn.err::before { background: var(--bad); }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, .5); }
    50% { opacity: .5; box-shadow: 0 0 0 5px rgba(74, 222, 128, 0); }
  }
  .clock { margin-left: auto; font-size: 12px; color: var(--dim); }
  .adminlink {
    font-size: 12px; color: var(--muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 12px;
    transition: color .18s, border-color .18s;
  }
  .adminlink:hover { color: var(--cyan); border-color: rgba(54,207,201,.4); }

  .stats { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 148px;
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; display: flex; flex-direction: column; gap: 3px;
  }
  .stat .k { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .stat .v { font-size: 20px; font-weight: 700; font-family: var(--mono); }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .stat .v.dn { color: var(--down); } .stat .v.upc { color: var(--up); }
  .stat .v.cy { color: var(--cyan); } .stat .v.pu { color: var(--purple); }

  /* ================= 工具条 ================= */
  .toolbar { max-width: 1480px; margin: 12px auto 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1; min-width: 180px; max-width: 320px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 12px; outline: none;
    transition: border-color .2s;
  }
  .search:focus { border-color: var(--cyan); }
  .search::placeholder { color: var(--dim); }
  .segs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .seg {
    border: none; background: none; cursor: pointer; color: var(--muted);
    font-family: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 6px;
    transition: background .18s, color .18s;
  }
  .seg:hover { color: var(--text); }
  .seg.on { background: rgba(54, 207, 201, .14); color: var(--cyan); }
  .tblabel { font-size: 12px; color: var(--dim); }

  /* ================= 卡片 ================= */
  .grid { max-width: 1480px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .card {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px 14px;
    transition: border-color .25s, transform .25s, box-shadow .25s, filter .4s, opacity .4s;
  }
  .card:hover { border-color: var(--border-hi); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .card.offline { opacity: .62; filter: grayscale(.75); }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .name { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
  .name .dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px rgba(74,222,128,.8); animation: pulse 2.2s infinite; }
  .card.offline .name .dot { background: var(--fail); box-shadow: none; animation: none; }
  .name .cflag { font-size: 16px; margin-right: 5px; line-height: 1; }
  .name .txt { overflow: hidden; text-overflow: ellipsis; }
  .name .id { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .up-rate { font-family: var(--mono); font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .up-rate b { font-weight: 700; }

  .sub { margin: 5px 0 0 16px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .metrics { display: flex; gap: 16px; margin-top: 13px; align-items: center; }
  .rings { display: flex; gap: 12px; flex-shrink: 0; }
  .ring { width: 66px; text-align: center; }
  .ring svg { width: 66px; height: 66px; display: block; }
  .ring .bg { fill: none; stroke: #1a2432; stroke-width: 7; }
  .ring .fg { fill: none; stroke-width: 7; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset .6s cubic-bezier(.3,.7,.3,1); }
  .ring text { fill: var(--text); font-size: 14px; font-weight: 700; text-anchor: middle; font-family: var(--mono); }
  .ring .label { font-size: 10.5px; color: var(--muted); margin-top: 3px; letter-spacing: 2px; }

  .nets { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .chartrow .rowline { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 3px; }
  .chartrow .dir { color: var(--muted); }
  .chartrow .dir.down { color: var(--down); } .chartrow .dir.up { color: var(--up); }
  .chartrow .rate { font-family: var(--mono); color: var(--text); font-weight: 600; }
  .chartrow canvas { width: 100%; height: 28px; display: block; }

  /* 三网延迟 */
  .pingsec { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--border); }
  .pinghead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .pinghead .to { color: var(--bad); font-family: var(--mono); }
  .isps { display: flex; gap: 8px; flex-wrap: wrap; }
  .isp { flex: 1 1 90px; min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px 4px; background: rgba(0,0,0,.18); }
  .isp .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; margin-bottom: 3px; gap: 4px; }
  .isp .who { letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .isp .val { font-family: var(--mono); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .isp canvas { width: 100%; height: 22px; display: block; }

  .footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); }
  .footer b { color: var(--text); font-weight: 600; font-family: var(--mono); }
  .diskwrap { display: flex; align-items: center; gap: 6px; }
  .diskbar { width: 52px; height: 5px; border-radius: 3px; background: #1a2432; overflow: hidden; }
  .diskbar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #38bdf8, #818cf8); transition: width .6s; }

  .offbadge {
    position: absolute; top: 13px; right: -34px; transform: rotate(38deg); z-index: 3;
    background: linear-gradient(90deg, #b91c1c, #7f1d1d); color: #fecaca;
    font-size: 11px; padding: 3px 40px; letter-spacing: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }

  .empty { max-width: 1480px; margin: 48px auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 2.4; }
  .empty code { background: var(--card); border: 1px solid var(--border); padding: 2px 10px; border-radius: 6px; color: var(--cyan); font-size: 12.5px; }
  footer.page { max-width: 1480px; margin: 28px auto 0; text-align: center; font-size: 11.5px; color: var(--dim); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>📡 VPS 探针</h1>
    <span class="conn" id="conn">连接中…</span>
    <a class="adminlink" href="/admin">⚙ 管理</a>
    <span class="clock mono" id="clock"></span>
  </div>
  <div class="stats">
    <div class="stat"><span class="k">在线机器</span><span class="v"><span id="stOnline">0</span><small> / <span id="stTotal">0</span></small></span></div>
    <div class="stat"><span class="k">实时下行</span><span class="v dn" id="stIn">0 B/s</span></div>
    <div class="stat"><span class="k">实时上行</span><span class="v upc" id="stOut">0 B/s</span></div>
    <div class="stat"><span class="k">累计总流量</span><span class="v cy" id="stBytes">0 KB</span></div>
    <div class="stat"><span class="k">TCP 总连接</span><span class="v pu" id="stTcp">0</span></div>
  </div>
</header>

<div class="toolbar">
  <input class="search" id="q" type="search" placeholder="🔍 搜索机器名 / ID / 系统…" autocomplete="off">
  <span class="tblabel">排序</span>
  <div class="segs" id="sortSegs">
    <button class="seg on" data-sort="default">默认</button>
    <button class="seg" data-sort="cpu">CPU</button>
    <button class="seg" data-sort="mem">内存</button>
    <button class="seg" data-sort="net">流量</button>
    <button class="seg" data-sort="ping">延迟</button>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  <span id="emptyMsg">还没有任何机器上报数据</span><br>
  去 VPS 上跑起来：<code>./agent.sh http://服务端地址:8790 你的TOKEN 机器名</code>
</div>

<footer class="page">zero-dependency probe · node server.js · MIT</footer>

<script>
(function () {
  'use strict';
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var emptyMsg = document.getElementById('emptyMsg');
  var connEl = document.getElementById('conn');
  var clockEl = document.getElementById('clock');
  var qEl = document.getElementById('q');

  // 探测目标由服务端下发（管理面板可增删改），这里只读当前帧的 targets
  function targets() { return (state.data && state.data.targets) || []; }
  function histKey(id) { return 'p_' + id; }

  var state = { data: null, sort: 'default', q: '' };

  /* ---------- 格式化 ---------- */
  function fmtRate(bps) {
    if (!isFinite(bps) || bps < 0) bps = 0;
    if (bps < 1024) return bps.toFixed(0) + ' B/s';
    if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
    if (bps < 1073741824) return (bps / 1048576).toFixed(2) + ' MB/s';
    return (bps / 1073741824).toFixed(2) + ' GB/s';
  }
  function fmtBytes(b) {
    b = Math.max(0, b);
    if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
    if (b < 1073741824) return (b / 1048576).toFixed(0) + ' MB';
    if (b < 1099511627776) return (b / 1073741824).toFixed(2) + ' GB';
    return (b / 1099511627776).toFixed(2) + ' TB';
  }
  function fmtUptime(sec) {
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    if (d > 0) return d + '天' + h + '时';
    if (h > 0) return h + '时' + m + '分';
    return m + '分';
  }
  function fmtAgo(sec) {
    if (sec < 60) return sec + 's 前';
    if (sec < 3600) return Math.floor(sec / 60) + 'm 前';
    return Math.floor(sec / 3600) + 'h 前';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function tierOf(p) { return p < 0 ? 'fail' : p < 80 ? 'good' : p < 180 ? 'mid' : 'bad'; }
  function tierColor(t) { return { good: '#4ade80', mid: '#facc15', bad: '#f87171', fail: '#64748b' }[t]; }
  function pingText(p) { return p < 0 ? '超时' : p.toFixed(0) + 'ms'; }

  var CIRC = 2 * Math.PI * 30;
  function ringHTML(pct, color, glow, label) {
    pct = Math.max(0, Math.min(100, pct || 0));
    return '<div class="ring"><svg viewBox="0 0 72 72">' +
      '<circle class="bg" cx="36" cy="36" r="30"/>' +
      '<circle class="fg" cx="36" cy="36" r="30" stroke="' + color + '" style="filter:drop-shadow(0 0 3px ' + glow + ')" stroke-dasharray="' + CIRC + '" stroke-dashoffset="' + (CIRC * (1 - pct / 100)) + '"/>' +
      '<text x="36" y="41">' + Math.round(pct) + '%</text>' +
      '</svg><div class="label">' + label + '</div></div>';
  }

  /* ---------- 筛选 + 排序 ---------- */
  function visibleMachines() {
    var ms = (state.data && state.data.machines) || [];
    var q = state.q.trim().toLowerCase();
    if (q) {
      ms = ms.filter(function (m) {
        return (m.name + ' ' + m.id + ' ' + m.os + ' ' + m.cpuModel + ' ' + m.virt +
                ' ' + (m.countryName || '') + ' ' + (m.country || '')).toLowerCase().indexOf(q) >= 0;
      });
    }
    var s = state.sort;
    if (s === 'default') return ms;   // 服务端已按在线优先 + 名称排好
    var keyed = ms.slice();
    keyed.sort(function (a, b) {
      if (a.online !== b.online) return a.online ? -1 : 1;
      if (s === 'cpu') return b.cpuPct - a.cpuPct;
      if (s === 'mem') return b.memPct - a.memPct;
      if (s === 'net') return (b.inRate + b.outRate) - (a.inRate + a.outRate);
      // 延迟：有效值升序，超时的排最后
      var pa = a.ping < 0 ? Infinity : a.ping, pb = b.ping < 0 ? Infinity : b.ping;
      return pa - pb;
    });
    return keyed;
  }

  /* ---------- 渲染 ---------- */
  function render() {
    if (!state.data) return;
    var all = state.data.machines || [];
    var ms = visibleMachines();

    var online = 0, sumIn = 0, sumOut = 0, sumBytes = 0, sumTcp = 0;
    all.forEach(function (m) {
      if (m.online) { online++; sumIn += m.inRate; sumOut += m.outRate; }
      sumBytes += Math.max(0, m.rxBytes) + Math.max(0, m.txBytes);
      sumTcp += m.tcpConns;
    });
    document.getElementById('stOnline').textContent = online;
    document.getElementById('stTotal').textContent = all.length;
    document.getElementById('stIn').textContent = fmtRate(sumIn);
    document.getElementById('stOut').textContent = fmtRate(sumOut);
    document.getElementById('stBytes').textContent = fmtBytes(sumBytes);
    document.getElementById('stTcp').textContent = sumTcp;
    clockEl.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });

    empty.style.display = ms.length ? 'none' : 'block';
    grid.style.display = ms.length ? 'grid' : 'none';
    if (!ms.length) emptyMsg.textContent = all.length ? '没有匹配「' + state.q + '」的机器' : '还没有任何机器上报数据';

    grid.innerHTML = ms.map(cardHTML).join('');
    // 同步绘制：读 clientWidth 会强制布局，拿到的就是最终尺寸。
    // 不能用 requestAnimationFrame——标签页在后台时 rAF 不触发，图表会一直空白。
    paintCharts(ms);
  }

  function cardHTML(m) {
    var diskPct = m.diskTotal > 0 ? m.diskUsed / m.diskTotal * 100 : 0;
    var ts = targets();
    var sub = [
      m.countryName || '',
      m.os,
      m.virt && m.virt !== 'unknown' ? m.virt : '',
      m.cpuCount ? m.cpuCount + 'C' : ''
    ].filter(Boolean).join(' · ');
    var timeouts = 0;
    ts.forEach(function (t) {
      (m.hist[histKey(t.id)] || []).forEach(function (v) { if (v < 0) timeouts++; });
    });
    var upPct = m.uptimePct;
    var upColor = upPct >= 99.5 ? 'var(--good)' : upPct >= 95 ? 'var(--mid)' : 'var(--bad)';

    var ispHTML = ts.map(function (t) {
      var v = (m.pings || {})[t.id];
      if (v === undefined) v = -1;
      return '<div class="isp"><div class="top"><span class="who" style="color:' + esc(t.color) + '">' + esc(t.label) + '</span>' +
        '<span class="val" style="color:' + tierColor(tierOf(v)) + '">' + pingText(v) + '</span></div>' +
        '<canvas data-k="' + esc(histKey(t.id)) + '"></canvas></div>';
    }).join('');

    return '<div class="card' + (m.online ? '' : ' offline') + '" data-id="' + esc(m.id) + '">' +
      (m.online ? '' : '<div class="offbadge">OFFLINE</div>') +
      '<div class="head">' +
        '<div class="name"><span class="dot"></span><span class="txt">' +
          '<span class="cflag" title="' + esc(m.countryName || '未知') + '">' + esc(m.flag || '🌐') + '</span>' +
          esc(m.name) + '<span class="id">' + esc(m.id) + '</span></span></div>' +
        '<div class="up-rate">可用 <b style="color:' + upColor + '">' + upPct.toFixed(2) + '%</b></div>' +
      '</div>' +
      '<div class="sub">' + esc(sub) + (m.cpuModel ? ' · ' + esc(m.cpuModel) : '') + '</div>' +
      '<div class="metrics">' +
        '<div class="rings">' + ringHTML(m.cpuPct, '#36cfc9', 'rgba(54,207,201,.55)', 'CPU') + ringHTML(m.memPct, '#b37feb', 'rgba(179,127,235,.55)', 'MEM') + '</div>' +
        '<div class="nets">' +
          '<div class="chartrow"><div class="rowline"><span class="dir down">↓ 下行</span><span class="rate">' + fmtRate(m.inRate) + '</span></div><canvas data-k="netIn"></canvas></div>' +
          '<div class="chartrow"><div class="rowline"><span class="dir up">↑ 上行</span><span class="rate">' + fmtRate(m.outRate) + '</span></div><canvas data-k="netOut"></canvas></div>' +
        '</div>' +
      '</div>' +
      (ts.length ? '<div class="pingsec">' +
        '<div class="pinghead"><span>TCPing 延迟 · ' + ts.length + ' 个目标</span>' +
        (timeouts ? '<span class="to">近 60 采样 ' + timeouts + ' 次超时</span>' : '<span style="color:var(--dim)">无丢包</span>') + '</div>' +
        '<div class="isps">' + ispHTML + '</div>' +
      '</div>' : '') +
      '<div class="footer">' +
        '<span>负载 <b>' + (+m.load1).toFixed(2) + '</b></span>' +
        '<span class="diskwrap">磁盘 <b>' + Math.round(diskPct) + '%</b><span class="diskbar"><i style="width:' + Math.min(100, diskPct) + '%"></i></span><span class="mono">' + fmtBytes(m.diskUsed) + '/' + fmtBytes(m.diskTotal) + '</span></span>' +
        '<span>TCP <b>' + m.tcpConns + '</b></span>' +
        '<span>运行 <b>' + fmtUptime(m.uptime) + '</b></span>' +
        '<span><span style="color:var(--down)">↓</span><b>' + fmtBytes(m.rxBytes) + '</b> <span style="color:var(--up)">↑</span><b>' + fmtBytes(m.txBytes) + '</b></span>' +
        (m.online ? '' : '<span style="color:var(--bad)">最后在线 ' + fmtAgo(m.lastSeenSec) + '</span>') +
      '</div>' +
    '</div>';
  }

  function paintCharts(ms) {
    var byHistKey = {};
    targets().forEach(function (t) { byHistKey[histKey(t.id)] = t; });
    ms.forEach(function (m) {
      var card = grid.querySelector('.card[data-id="' + CSS.escape(m.id) + '"]');
      if (!card) return;
      card.querySelectorAll('canvas').forEach(function (cv) {
        var key = cv.getAttribute('data-k');
        var hist = m.hist[key] || [];
        if (key === 'netIn') spark(cv, hist, '#4ade80');
        else if (key === 'netOut') spark(cv, hist, '#f472b6');
        else if (byHistKey[key]) pingChart(cv, hist, byHistKey[key].color);
      });
    });
  }

  /* ---------- 网络波形 ---------- */
  function setup(cv, hDefault) {
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth || 200, h = cv.clientHeight || hDefault;
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx: ctx, w: w, h: h };
  }

  function spark(cv, data, color) {
    var s = setup(cv, 28), ctx = s.ctx, w = s.w, h = s.h;
    if (!data.length) return;
    var n = data.length;
    var max = Math.max.apply(null, data);
    if (max < 1e-6) max = 1;
    var X = function (i) { return n === 1 ? 1 : 1 + i / (n - 1) * (w - 2); };
    var Y = function (v) { return h - 2.5 - Math.min(1, v / max) * (h - 8); };

    ctx.beginPath();
    ctx.moveTo(X(0), Y(data[0]));
    for (var i = 1; i < n; i++) ctx.lineTo(X(i), Y(data[i]));
    ctx.lineTo(X(n - 1), h); ctx.lineTo(X(0), h); ctx.closePath();
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, color + '3d'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(X(0), Y(data[0]));
    for (var j = 1; j < n; j++) ctx.lineTo(X(j), Y(data[j]));
    ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke();

    ctx.beginPath();
    ctx.arc(X(n - 1), Y(data[n - 1]), 2.2, 0, 7);
    ctx.fillStyle = color; ctx.fill();
  }

  /* ---------- 延迟迷你图：超时画红叉，断线不连 ---------- */
  function pingChart(cv, data, color) {
    var s = setup(cv, 22), ctx = s.ctx, w = s.w, h = s.h;
    var valid = data.filter(function (p) { return p >= 0; });
    var maxV = Math.max(60, (valid.length ? Math.max.apply(null, valid) : 0) * 1.25);
    var Y = function (v) { return h - 2.5 - Math.min(1, v / maxV) * (h - 6); };

    ctx.strokeStyle = 'rgba(125,141,163,.13)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(1, Y(maxV / 2)); ctx.lineTo(w - 1, Y(maxV / 2)); ctx.stroke();

    if (!data.length) return;
    var n = data.length;
    var X = function (i) { return n === 1 ? 1 : 1 + i / (n - 1) * (w - 2); };

    ctx.beginPath();
    var pen = false;
    for (var i = 0; i < n; i++) {
      if (data[i] < 0) { pen = false; continue; }
      if (!pen) { ctx.moveTo(X(i), Y(data[i])); pen = true; } else ctx.lineTo(X(i), Y(data[i]));
    }
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();

    for (var t = 0; t < n; t++) {
      if (data[t] >= 0) continue;
      var x = X(t), y = h - 3.5;
      ctx.strokeStyle = 'rgba(248,113,113,.9)'; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(x - 2.2, y - 2.2); ctx.lineTo(x + 2.2, y + 2.2);
      ctx.moveTo(x + 2.2, y - 2.2); ctx.lineTo(x - 2.2, y + 2.2);
      ctx.stroke();
    }

    var last = -1;
    for (var k = n - 1; k >= 0; k--) if (data[k] >= 0) { last = k; break; }
    if (last >= 0) { ctx.beginPath(); ctx.arc(X(last), Y(data[last]), 2, 0, 7); ctx.fillStyle = color; ctx.fill(); }
  }

  /* ---------- 交互 ---------- */
  var qTimer = 0;
  qEl.addEventListener('input', function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = qEl.value; render(); }, 120);
  });
  document.getElementById('sortSegs').addEventListener('click', function (e) {
    var btn = e.target.closest('.seg');
    if (!btn) return;
    this.querySelectorAll('.seg').forEach(function (b) { b.classList.toggle('on', b === btn); });
    state.sort = btn.getAttribute('data-sort');
    render();
  });
  window.addEventListener('resize', function () {
    if (state.data) paintCharts(visibleMachines());
  });

  /* ---------- SSE ---------- */
  var es = new EventSource('/api/stream');
  es.onopen = function () { connEl.textContent = '实时'; connEl.className = 'conn live'; };
  es.onerror = function () { connEl.textContent = '重连中…'; connEl.className = 'conn err'; };
  es.onmessage = function (e) { try { state.data = JSON.parse(e.data); render(); } catch (_) {} };
})();
</script>
</body>
